# Render.com "Blueprint" infrastructure-as-code definition.
# Provisions a PostgreSQL database and a Node.js web service that serves
# both the API and the built frontend (single service).

services:
  - type: web
    name: office-shift-manager
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: |
      cd ../frontend && npm install && npm run build
      cd ../backend && cp -r ../frontend/dist ./dist
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: office-shift-db
          property: connectionString
      - key: PORT
        value: 3000
      - key: ENGINES_NODE_VERSION
        value: "22"

databases:
  - name: office-shift-db
    databaseName: office_shift
    plan: free
    ipAllowList: []
